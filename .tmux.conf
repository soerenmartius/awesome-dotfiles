# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Make `Ctrl+A R` reload the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# set -g status-style 'bg=default fg=#5eacd3'
# set -g base-index

# Use Vim shortcuts
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# Option+drag selects with tmux even when the app in the pane owns the mouse
# (Claude Code's fullscreen TUI, nvim), and copies on release like a plain drag.
bind -n M-MouseDrag1Pane copy-mode -M
bind -T copy-mode-vi M-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Activate sane scrolling
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

set-option -g focus-events on
set-option -sg escape-time 10
set-option -g default-terminal "tmux-256color"
# Ghostty sets TERM=xterm-ghostty outside tmux; tell tmux it can do true color.
set -as terminal-features ",xterm-ghostty:RGB"

# https://github.com/vimpostor/vim-tpipeline
# Used for Neovim
set -g status-left-length 90
set -g status-right-length 90
set -g status-justify centre
set -g status-bg "#1a1b26"
set -g status-fg "#a9b1d6"
set -g status-right ""
set -g status-left ""
set -g window-status-current-format "#[fg=magenta]#[fg=black]#[bg=magenta]#I #[bg=brightblack]#[fg=white] #W#[fg=brightblack]#[bg=black]"
set -g window-status-format "#[fg=yellow]#[fg=black]#[bg=yellow]#I #[bg=brightblack]#[fg=white] #W#[fg=brightblack]#[bg=black]"

# Plain shell in new panes (reattach-to-user-namespace is not needed on current macOS)
set-option -g default-command "${SHELL}"

# Bigger history (Claude Code sessions produce a lot of output)
set -g history-limit 100000

# New windows/panes in $PWD
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
set -g renumber-windows on

# Popups: lazygit for the current repo, and a scratch shell
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Show each pane's title above it. Claude Code sets its title to the current
# conversation summary, so every session is labelled with what it is doing.
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_title} "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"

# A bell in any window (Claude Code finishing or waiting for input) highlights
# that window in the status bar; Ghostty bounces the dock icon on its own.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g window-status-bell-style "fg=black,bg=yellow,bold"

# Fix key bindings broken in tmux 2.1
set -g assume-paste-time 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Save/restore tmux environment
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Auto-save + optional auto-restore after reboot
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval '15'
# Restore is driven by ~/.local/bin/tmux-work (Ghostty's command) instead of
# continuum's boot hook, which silently skips when several Ghostty windows open
# at once. Manual restore is still prefix + Ctrl-r.
set -g @continuum-restore 'off'
# Relaunch Claude Code panes through a wrapper that resumes the saved
# conversation instead of starting a new one (see ~/.local/bin/claude-resurrect).
set -g @resurrect-processes '"~claude->claude-resurrect *"'
# After every save, stamp Claude panes with their session ID (read from
# ~/.claude/sessions/<pid>.json) so the restore resumes exactly that conversation.
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-resurrect-claude-ids'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
